<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Speed Tap Frenzy</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 90vw;
      max-width: 360px;
      margin-bottom: 12px;
      font-size: 18px;
      font-weight: bold;
    }
    .timer { color: #f59e0b; }
    .score { color: #10b981; }
    .play-area {
      width: 90vw;
      max-width: 360px;
      height: 70vh;
      max-height: 500px;
      background: #111827;
      border: 2px solid #374151;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(16, 185, 129, 0.2);
    }
    .target {
      position: absolute;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle, #f43f5e 30%, #be123c 100%);
      box-shadow: 0 0 15px #f43f5e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .target:active { transform: scale(0.85); }
    .btn {
      margin-top: 15px;
      background: #10b981;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="timer">⏱️ <span id="time">15</span>s</div>
    <div class="score">SCORE: <span id="score">0</span></div>
  </div>
  <div class="play-area" id="play-area"></div>
  <button class="btn" id="start-btn" onclick="startGame()">🚀 Start Frenzy</button>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    let score = 0;
    let timeLeft = 15;
    let timerId = null;
    let isPlaying = false;
    const playArea = document.getElementById('play-area');

    function startGame() {
      if (isPlaying) return;
      score = 0;
      timeLeft = 15;
      isPlaying = true;
      document.getElementById('score').innerText = '0';
      document.getElementById('time').innerText = timeLeft;
      document.getElementById('start-btn').style.display = 'none';

      spawnTarget();

      timerId = setInterval(() => {
        timeLeft--;
        document.getElementById('time').innerText = timeLeft;
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function spawnTarget() {
      playArea.innerHTML = '';
      if (!isPlaying) return;

      const target = document.createElement('div');
      target.className = 'target';
      target.innerText = '⚡';

      const maxX = playArea.clientWidth - 70;
      const maxY = playArea.clientHeight - 70;
      const rx = Math.max(10, Math.floor(Math.random() * maxX));
      const ry = Math.max(10, Math.floor(Math.random() * maxY));

      target.style.left = `${rx}px`;
      target.style.top = `${ry}px`;

      target.onpointerdown = (e) => {
        e.stopPropagation();
        if (!isPlaying) return;
        score += 10;
        document.getElementById('score').innerText = score;
        if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        spawnTarget();
      };

      playArea.appendChild(target);
    }

    function endGame() {
      isPlaying = false;
      clearInterval(timerId);
      playArea.innerHTML = '';
      document.getElementById('start-btn').style.display = 'block';
      document.getElementById('start-btn').innerText = '🔄 Play Again';

      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      window.parent.postMessage({
        type: 'SCORE_UPDATE',
        gameId: 'game-speed-clicker',
        score: score
      }, '*');

      alert(`⚡ Frenzy Finished! Final Score: ${score}`);
    }
  </script>
</body>
</html>
