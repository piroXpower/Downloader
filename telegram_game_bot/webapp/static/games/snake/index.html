<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Retro Snake 97</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #080c14;
      color: #98c379;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 90vw;
      max-width: 360px;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 16px;
    }
    #game-canvas {
      background: #111a14;
      border: 3px solid #22c55e;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.25);
      width: 90vw;
      max-width: 360px;
      height: 90vw;
      max-height: 360px;
    }
    .d-pad {
      margin-top: 16px;
      display: grid;
      grid-template-columns: repeat(3, 60px);
      grid-gap: 8px;
    }
    .d-btn {
      background: #16201b;
      border: 1px solid #22c55e;
      color: #22c55e;
      font-size: 20px;
      height: 50px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .d-btn:active {
      background: #22c55e;
      color: #000;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>SCORE: <span id="score">0</span></div>
    <div>BEST: <span id="best">0</span></div>
  </div>
  <canvas id="game-canvas"></canvas>

  <div class="d-pad">
    <div></div>
    <button class="d-btn" onclick="setDir('UP')">▲</button>
    <div></div>
    <button class="d-btn" onclick="setDir('LEFT')">◀</button>
    <button class="d-btn" onclick="restart()">🔄</button>
    <button class="d-btn" onclick="setDir('RIGHT')">▶</button>
    <div></div>
    <button class="d-btn" onclick="setDir('DOWN')">▼</button>
    <div></div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 360;
    canvas.height = 360;

    const grid = 18;
    const tileCount = canvas.width / grid;

    let snake = [{ x: 10, y: 10 }];
    let food = { x: 5, y: 5 };
    let dx = 1, dy = 0;
    let nextDx = 1, nextDy = 0;
    let score = 0;
    let best = parseInt(localStorage.getItem('snake_best') || '0', 10);
    document.getElementById('best').innerText = best;
    let interval = null;

    function spawnFood() {
      food.x = Math.floor(Math.random() * tileCount);
      food.y = Math.floor(Math.random() * tileCount);
      for (let s of snake) {
        if (s.x === food.x && s.y === food.y) return spawnFood();
      }
    }

    function setDir(dir) {
      if (dir === 'UP' && dy !== 1) { nextDx = 0; nextDy = -1; }
      if (dir === 'DOWN' && dy !== -1) { nextDx = 0; nextDy = 1; }
      if (dir === 'LEFT' && dx !== 1) { nextDx = -1; nextDy = 0; }
      if (dir === 'RIGHT' && dx !== -1) { nextDx = 1; nextDy = 0; }
      if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
    }

    function restart() {
      snake = [{ x: 10, y: 10 }];
      dx = 1; dy = 0;
      nextDx = 1; nextDy = 0;
      score = 0;
      document.getElementById('score').innerText = score;
      spawnFood();
      if (interval) clearInterval(interval);
      interval = setInterval(gameStep, 110);
    }

    function gameStep() {
      dx = nextDx;
      dy = nextDy;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Wall collision (wrap around or wall dead - classic wall collision)
      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        return gameOver();
      }

      // Self collision
      for (let s of snake) {
        if (head.x === s.x && head.y === s.y) return gameOver();
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('score').innerText = score;
        if (score > best) {
          best = score;
          localStorage.setItem('snake_best', best);
          document.getElementById('best').innerText = best;
        }
        if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function gameOver() {
      clearInterval(interval);
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
      window.parent.postMessage({
        type: 'SCORE_UPDATE',
        gameId: 'game-snake',
        score: score
      }, '*');
      alert(`Game Over! Score: ${score}`);
      restart();
    }

    function draw() {
      // Background
      ctx.fillStyle = '#111a14';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid lines
      ctx.strokeStyle = '#162b1e';
      ctx.lineWidth = 0.5;
      for (let i = 0; i < canvas.width; i += grid) {
        ctx.beginPath();
        ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height);
        ctx.moveTo(0, i); ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // Food
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(food.x * grid + grid / 2, food.y * grid + grid / 2, grid / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Snake
      snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? '#4ade80' : '#22c55e';
        ctx.fillRect(s.x * grid + 1, s.y * grid + 1, grid - 2, grid - 2);
      });
    }

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowUp') setDir('UP');
      if (e.key === 'ArrowDown') setDir('DOWN');
      if (e.key === 'ArrowLeft') setDir('LEFT');
      if (e.key === 'ArrowRight') setDir('RIGHT');
    });

    restart();
  </script>
</body>
</html>
