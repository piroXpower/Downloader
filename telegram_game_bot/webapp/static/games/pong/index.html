<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Pong Arena</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #06090e;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    .hud {
      display: flex;
      justify-content: space-around;
      width: 90vw;
      max-width: 360px;
      margin-bottom: 12px;
      font-size: 20px;
      font-weight: 800;
    }
    .player-label { color: #38bdf8; }
    .ai-label { color: #f43f5e; }
    #canvas {
      background: #0f172a;
      border: 2px solid #1e293b;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.2);
      width: 90vw;
      max-width: 360px;
      height: 70vh;
      max-height: 520px;
      display: block;
    }
    .touch-controls {
      display: flex;
      gap: 15px;
      margin-top: 15px;
      width: 90vw;
      max-width: 360px;
    }
    .touch-btn {
      flex: 1;
      padding: 14px;
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #38bdf8;
      border-radius: 8px;
      font-size: 20px;
      font-weight: bold;
    }
    .touch-btn:active { background: #38bdf8; color: #000; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="player-label">YOU: <span id="p-score">0</span></div>
    <div class="ai-label">AI: <span id="ai-score">0</span></div>
  </div>
  <canvas id="canvas"></canvas>

  <div class="touch-controls">
    <button class="touch-btn" id="btn-left">◀ LEFT</button>
    <button class="touch-btn" id="btn-right">RIGHT ▶</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 360;
    canvas.height = 520;

    const paddleW = 75, paddleH = 12;
    let playerX = (canvas.width - paddleW) / 2;
    let aiX = (canvas.width - paddleW) / 2;

    let ballX = canvas.width / 2;
    let ballY = canvas.height / 2;
    let ballVX = 3.5 * (Math.random() > 0.5 ? 1 : -1);
    let ballVY = 4;
    const ballR = 7;

    let playerScore = 0, aiScore = 0;
    let isMovingLeft = false, isMovingRight = false;

    function resetBall() {
      ballX = canvas.width / 2;
      ballY = canvas.height / 2;
      ballVX = 3.5 * (Math.random() > 0.5 ? 1 : -1);
      ballVY = (Math.random() > 0.5 ? 4 : -4);
    }

    // Touch and drag directly on canvas
    canvas.addEventListener('touchmove', e => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const touchX = (e.touches[0].clientX - rect.left) * scaleX;
      playerX = Math.max(0, Math.min(canvas.width - paddleW, touchX - paddleW / 2));
    }, { passive: true });

    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');
    btnLeft.addEventListener('pointerdown', () => isMovingLeft = true);
    btnLeft.addEventListener('pointerup', () => isMovingLeft = false);
    btnLeft.addEventListener('pointerleave', () => isMovingLeft = false);

    btnRight.addEventListener('pointerdown', () => isMovingRight = true);
    btnRight.addEventListener('pointerup', () => isMovingRight = false);
    btnRight.addEventListener('pointerleave', () => isMovingRight = false);

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') isMovingLeft = true;
      if (e.key === 'ArrowRight') isMovingRight = true;
    });
    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft') isMovingLeft = false;
      if (e.key === 'ArrowRight') isMovingRight = false;
    });

    function update() {
      if (isMovingLeft) playerX = Math.max(0, playerX - 6);
      if (isMovingRight) playerX = Math.min(canvas.width - paddleW, playerX + 6);

      // AI movement (smooth tracking with slight human-like lag)
      const aiCenter = aiX + paddleW / 2;
      if (aiCenter < ballX - 10) aiX = Math.min(canvas.width - paddleW, aiX + 4.2);
      else if (aiCenter > ballX + 10) aiX = Math.max(0, aiX - 4.2);

      // Move ball
      ballX += ballVX;
      ballY += ballVY;

      // Side wall bounces
      if (ballX - ballR <= 0 || ballX + ballR >= canvas.width) {
        ballVX = -ballVX;
      }

      // Player paddle collision (bottom)
      if (
        ballY + ballR >= canvas.height - 30 - paddleH &&
        ballY - ballR <= canvas.height - 30 &&
        ballX >= playerX && ballX <= playerX + paddleW
      ) {
        ballVY = -Math.abs(ballVY) * 1.04;
        let delta = (ballX - (playerX + paddleW / 2)) / (paddleW / 2);
        ballVX = delta * 5;
        if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
      }

      // AI paddle collision (top)
      if (
        ballY - ballR <= 30 + paddleH &&
        ballY + ballR >= 30 &&
        ballX >= aiX && ballX <= aiX + paddleW
      ) {
        ballVY = Math.abs(ballVY) * 1.04;
        let delta = (ballX - (aiX + paddleW / 2)) / (paddleW / 2);
        ballVX = delta * 5;
      }

      // Scoring
      if (ballY > canvas.height) {
        aiScore++;
        document.getElementById('ai-score').innerText = aiScore;
        checkMatchEnd();
        resetBall();
      } else if (ballY < 0) {
        playerScore++;
        document.getElementById('p-score').innerText = playerScore;
        checkMatchEnd();
        resetBall();
      }
    }

    function checkMatchEnd() {
      if (playerScore >= 5 || aiScore >= 5) {
        const won = playerScore > aiScore;
        const totalPoints = playerScore * 100 - aiScore * 20;
        window.parent.postMessage({
          type: 'SCORE_UPDATE',
          gameId: 'game-pong',
          score: Math.max(0, totalPoints)
        }, '*');
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred(won ? 'success' : 'error');
        alert(won ? '🏆 Victory! You won 5 points!' : 'Game Over! AI won.');
        playerScore = 0; aiScore = 0;
        document.getElementById('p-score').innerText = '0';
        document.getElementById('ai-score').innerText = '0';
      }
    }

    function draw() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center divider line
      ctx.strokeStyle = '#334155';
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(0, canvas.height / 2);
      ctx.lineTo(canvas.width, canvas.height / 2);
      ctx.stroke();
      ctx.setLineDash([]);

      // Draw AI Paddle
      ctx.fillStyle = '#f43f5e';
      ctx.shadowColor = '#f43f5e';
      ctx.shadowBlur = 12;
      ctx.fillRect(aiX, 30, paddleW, paddleH);

      // Draw Player Paddle
      ctx.fillStyle = '#38bdf8';
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 12;
      ctx.fillRect(playerX, canvas.height - 30 - paddleH, paddleW, paddleH);

      // Draw Ball
      ctx.fillStyle = '#f8fafc';
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.arc(ballX, ballY, ballR, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
