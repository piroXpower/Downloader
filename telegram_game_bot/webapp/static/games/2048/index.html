<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>2048 Neon Deluxe</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0d1117;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    .header {
      width: 90%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .title {
      font-size: 32px;
      font-weight: 900;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .score-container {
      display: flex;
      gap: 8px;
    }
    .score-box {
      background: #161b22;
      border: 1px solid #30363d;
      padding: 6px 12px;
      border-radius: 8px;
      text-align: center;
      min-width: 70px;
    }
    .score-label { font-size: 10px; color: #8b949e; text-transform: uppercase; }
    .score-val { font-size: 18px; font-weight: bold; color: #58a6ff; }
    #grid {
      width: 90vw;
      height: 90vw;
      max-width: 380px;
      max-height: 380px;
      background: #161b22;
      border: 2px solid #30363d;
      border-radius: 12px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-gap: 8px;
      padding: 8px;
      position: relative;
    }
    .tile {
      background: #21262d;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: bold;
      transition: all 0.15s ease-in-out;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
    }
    .tile-2 { background: #238636; color: #fff; box-shadow: 0 0 10px #23863688; }
    .tile-4 { background: #2ea043; color: #fff; box-shadow: 0 0 10px #2ea04388; }
    .tile-8 { background: #388bfd; color: #fff; box-shadow: 0 0 12px #388bfd88; }
    .tile-16 { background: #1f6feb; color: #fff; box-shadow: 0 0 12px #1f6feb88; }
    .tile-32 { background: #a371f7; color: #fff; box-shadow: 0 0 14px #a371f788; }
    .tile-64 { background: #8957e5; color: #fff; box-shadow: 0 0 14px #8957e588; }
    .tile-128 { background: #f0883e; color: #fff; box-shadow: 0 0 16px #f0883e88; font-size: 22px; }
    .tile-256 { background: #d29922; color: #fff; box-shadow: 0 0 16px #d2992288; font-size: 22px; }
    .tile-512 { background: #f85149; color: #fff; box-shadow: 0 0 18px #f8514988; font-size: 22px; }
    .tile-1024 { background: #da3633; color: #fff; box-shadow: 0 0 20px #da363388; font-size: 18px; }
    .tile-2048 { background: #ff007f; color: #fff; box-shadow: 0 0 25px #ff007f; font-size: 18px; }
    .controls {
      margin-top: 15px;
      display: flex;
      gap: 12px;
    }
    .btn {
      background: #238636;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    .btn:active { transform: scale(0.96); }
    .hint { font-size: 12px; color: #8b949e; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">2048</div>
    <div class="score-container">
      <div class="score-box">
        <div class="score-label">Score</div>
        <div id="score" class="score-val">0</div>
      </div>
      <div class="score-box">
        <div class="score-label">Best</div>
        <div id="best-score" class="score-val">0</div>
      </div>
    </div>
  </div>

  <div id="grid"></div>

  <div class="controls">
    <button class="btn" onclick="initGame()">🔄 Restart</button>
    <button class="btn" style="background: #1f6feb;" onclick="submitScore()">🏆 Submit Score</button>
  </div>
  <div class="hint">Swipe or use Arrow Keys to slide tiles</div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    let board = [];
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('2048_best') || '0', 10);
    document.getElementById('best-score').innerText = bestScore;

    function initGame() {
      board = Array(4).fill().map(() => Array(4).fill(0));
      score = 0;
      updateScore(0);
      spawnTile();
      spawnTile();
      render();
    }

    function spawnTile() {
      let empty = [];
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (board[r][c] === 0) empty.push({ r, c });
        }
      }
      if (empty.length > 0) {
        let spot = empty[Math.floor(Math.random() * empty.length)];
        board[spot.r][spot.c] = Math.random() < 0.9 ? 2 : 4;
      }
    }

    function render() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          const val = board[r][c];
          const div = document.createElement('div');
          div.className = `tile ${val ? 'tile-' + (val <= 2048 ? val : 2048) : ''}`;
          div.innerText = val ? val : '';
          grid.appendChild(div);
        }
      }
    }

    function updateScore(add) {
      score += add;
      document.getElementById('score').innerText = score;
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('2048_best', bestScore);
        document.getElementById('best-score').innerText = bestScore;
      }
    }

    function slide(row) {
      let filtered = row.filter(val => val !== 0);
      for (let i = 0; i < filtered.length - 1; i++) {
        if (filtered[i] === filtered[i + 1]) {
          filtered[i] *= 2;
          updateScore(filtered[i]);
          filtered[i + 1] = 0;
        }
      }
      filtered = filtered.filter(val => val !== 0);
      while (filtered.length < 4) filtered.push(0);
      return filtered;
    }

    function moveLeft() {
      let moved = false;
      for (let r = 0; r < 4; r++) {
        let old = [...board[r]];
        board[r] = slide(board[r]);
        if (JSON.stringify(old) !== JSON.stringify(board[r])) moved = true;
      }
      return moved;
    }

    function rotate() {
      board = board[0].map((_, i) => board.map(row => row[i]).reverse());
    }

    function move(dir) {
      let moved = false;
      if (dir === 'left') moved = moveLeft();
      if (dir === 'down') { rotate(); moved = moveLeft(); rotate(); rotate(); rotate(); }
      if (dir === 'right') { rotate(); rotate(); moved = moveLeft(); rotate(); rotate(); }
      if (dir === 'up') { rotate(); rotate(); rotate(); moved = moveLeft(); rotate(); }

      if (moved) {
        spawnTile();
        render();
        checkGameOver();
      }
    }

    function checkGameOver() {
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (board[r][c] === 0) return;
          if (r < 3 && board[r][c] === board[r+1][c]) return;
          if (c < 3 && board[r][c] === board[r][c+1]) return;
        }
      }
      submitScore();
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
      alert('Game Over! Your Score: ' + score);
    }

    function submitScore() {
      window.parent.postMessage({
        type: 'SCORE_UPDATE',
        gameId: 'game-2048',
        score: score
      }, '*');
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    }

    // Keyboard support
    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') move('left');
      if (e.key === 'ArrowRight') move('right');
      if (e.key === 'ArrowUp') move('up');
      if (e.key === 'ArrowDown') move('down');
    });

    // Touch swipe support
    let touchStartX = 0, touchStartY = 0;
    document.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].clientX;
      touchStartY = e.changedTouches[0].clientY;
    }, { passive: true });

    document.addEventListener('touchend', e => {
      let dx = e.changedTouches[0].clientX - touchStartX;
      let dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
        move(dx > 0 ? 'right' : 'left');
      } else if (Math.abs(dy) > 30) {
        move(dy > 0 ? 'down' : 'up');
      }
    }, { passive: true });

    initGame();
  </script>
</body>
</html>
