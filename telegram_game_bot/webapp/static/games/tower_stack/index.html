<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tower Stack 3D</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 90vw;
      max-width: 360px;
      margin-bottom: 8px;
      font-weight: bold;
      color: #38bdf8;
    }
    #canvas {
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      border: 2px solid #334155;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      width: 90vw;
      max-width: 360px;
      height: 75vh;
      max-height: 540px;
    }
    .hint {
      margin-top: 8px;
      color: #94a3b8;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>STACK: <span id="score">0</span></div>
    <div>BEST: <span id="best">0</span></div>
  </div>
  <canvas id="canvas"></canvas>
  <div class="hint">Tap screen to place block perfectly!</div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 360;
    canvas.height = 540;

    const blockHeight = 24;
    let stack = [];
    let currentBlock = null;
    let dir = 1;
    let speed = 3.5;
    let score = 0;
    let best = parseInt(localStorage.getItem('stack_best') || '0', 10);
    document.getElementById('best').innerText = best;
    let gameOver = false;

    const palette = [
      '#ef4444', '#f97316', '#f59e0b', '#10b981', '#06b6d4', '#3b82f6', '#8b5cf6', '#ec4899'
    ];

    function getColor(index) {
      return palette[index % palette.length];
    }

    function initGame() {
      stack = [
        { x: 80, width: 200, y: canvas.height - blockHeight * 2, color: getColor(0) }
      ];
      score = 0;
      speed = 3.5;
      gameOver = false;
      document.getElementById('score').innerText = '0';
      spawnCurrent();
    }

    function spawnCurrent() {
      const top = stack[stack.length - 1];
      currentBlock = {
        x: 0,
        width: top.width,
        y: top.y - blockHeight,
        color: getColor(stack.length)
      };
      dir = 1;
    }

    function placeBlock() {
      if (gameOver) {
        initGame();
        return;
      }

      const top = stack[stack.length - 1];
      const diff = currentBlock.x - top.x;

      if (Math.abs(diff) < 3) {
        // Perfect match bonus!
        currentBlock.x = top.x;
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      } else if (Math.abs(diff) >= currentBlock.width) {
        // Missed completely!
        return endGame();
      } else {
        // Cut block
        if (diff > 0) {
          currentBlock.width -= diff;
        } else {
          currentBlock.width += diff;
          currentBlock.x = top.x;
        }
        if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
      }

      stack.push(currentBlock);
      score++;
      document.getElementById('score').innerText = score;
      if (score > best) {
        best = score;
        localStorage.setItem('stack_best', best);
        document.getElementById('best').innerText = best;
      }

      // Scroll camera view down if stack reaches high
      if (currentBlock.y < canvas.height / 2) {
        for (let b of stack) b.y += blockHeight;
      }

      speed = Math.min(7.5, speed + 0.1);
      spawnCurrent();
    }

    function endGame() {
      gameOver = true;
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
      window.parent.postMessage({
        type: 'SCORE_UPDATE',
        gameId: 'game-tower-stack',
        score: score
      }, '*');
    }

    window.addEventListener('pointerdown', placeBlock);
    window.addEventListener('keydown', e => { if (e.code === 'Space') placeBlock(); });

    function update() {
      if (!gameOver && currentBlock) {
        currentBlock.x += speed * dir;
        if (currentBlock.x + currentBlock.width > canvas.width) {
          dir = -1;
        } else if (currentBlock.x < 0) {
          dir = 1;
        }
      }
    }

    function draw() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Stack
      stack.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, b.width, blockHeight - 2);
        // Highlight top rim
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(b.x, b.y, b.width, 3);
      });

      // Draw Moving Block
      if (!gameOver && currentBlock) {
        ctx.fillStyle = currentBlock.color;
        ctx.fillRect(currentBlock.x, currentBlock.y, currentBlock.width, blockHeight - 2);
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fillRect(currentBlock.x, currentBlock.y, currentBlock.width, 3);
      }

      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 28px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, 220);
        ctx.fillStyle = '#ffffff';
        ctx.font = '20px sans-serif';
        ctx.fillText('Final Height: ' + score, canvas.width / 2, 260);
        ctx.fillStyle = '#38bdf8';
        ctx.font = '16px sans-serif';
        ctx.fillText('Tap to Try Again', canvas.width / 2, 310);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    initGame();
    loop();
  </script>
</body>
</html>
