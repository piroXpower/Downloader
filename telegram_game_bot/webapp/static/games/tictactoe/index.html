<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tic Tac Toe Cyber</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
    }
    .status {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 15px;
      color: #38bdf8;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 90px);
      grid-gap: 12px;
      background: #1e293b;
      padding: 12px;
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
    }
    .cell {
      width: 90px;
      height: 90px;
      background: #0f172a;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: 900;
      cursor: pointer;
      border: 1px solid #334155;
    }
    .cell.x { color: #38bdf8; text-shadow: 0 0 15px #38bdf8; }
    .cell.o { color: #f43f5e; text-shadow: 0 0 15px #f43f5e; }
    .controls {
      margin-top: 20px;
      display: flex;
      gap: 12px;
    }
    .btn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="status" id="status">Your Turn (X)</div>
  <div class="board" id="board"></div>
  <div class="controls">
    <button class="btn" onclick="resetGame()">🔄 Reset</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    let boardState = Array(9).fill('');
    let gameActive = true;
    let score = 0;

    function renderBoard() {
      const board = document.getElementById('board');
      board.innerHTML = '';
      boardState.forEach((val, i) => {
        const cell = document.createElement('div');
        cell.className = `cell ${val.toLowerCase()}`;
        cell.innerText = val;
        cell.onclick = () => makeMove(i);
        board.appendChild(cell);
      });
    }

    function makeMove(i) {
      if (!gameActive || boardState[i] !== '') return;

      boardState[i] = 'X';
      renderBoard();
      if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();

      if (checkWin('X')) {
        document.getElementById('status').innerText = '🎉 You Won!';
        gameActive = false;
        score += 100;
        window.parent.postMessage({
          type: 'SCORE_UPDATE',
          gameId: 'game-tictactoe',
          score: score
        }, '*');
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        return;
      }

      if (boardState.every(c => c !== '')) {
        document.getElementById('status').innerText = '🤝 Draw!';
        gameActive = false;
        return;
      }

      document.getElementById('status').innerText = 'AI Thinking...';
      gameActive = false;
      setTimeout(aiMove, 300);
    }

    function aiMove() {
      // Find empty spots
      const empties = boardState.map((v, i) => v === '' ? i : null).filter(v => v !== null);
      if (empties.length === 0) return;

      // Smart move check
      let chosen = null;
      // 1. Can AI win?
      for (let idx of empties) {
        boardState[idx] = 'O';
        if (checkWin('O')) { chosen = idx; boardState[idx] = ''; break; }
        boardState[idx] = '';
      }
      // 2. Can player win? Block!
      if (chosen === null) {
        for (let idx of empties) {
          boardState[idx] = 'X';
          if (checkWin('X')) { chosen = idx; boardState[idx] = ''; break; }
          boardState[idx] = '';
        }
      }
      // 3. Take center or random
      if (chosen === null) {
        if (boardState[4] === '') chosen = 4;
        else chosen = empties[Math.floor(Math.random() * empties.length)];
      }

      boardState[chosen] = 'O';
      renderBoard();

      if (checkWin('O')) {
        document.getElementById('status').innerText = '💀 AI Won!';
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
      } else if (boardState.every(c => c !== '')) {
        document.getElementById('status').innerText = '🤝 Draw!';
      } else {
        document.getElementById('status').innerText = 'Your Turn (X)';
        gameActive = true;
      }
    }

    function checkWin(p) {
      const wins = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
      ];
      return wins.some(([a, b, c]) => boardState[a] === p && boardState[b] === p && boardState[c] === p);
    }

    function resetGame() {
      boardState = Array(9).fill('');
      gameActive = true;
      document.getElementById('status').innerText = 'Your Turn (X)';
      renderBoard();
    }

    resetGame();
  </script>
</body>
</html>
