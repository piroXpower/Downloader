<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Memory Matrix Flip</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0d1117;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 90vw;
      max-width: 360px;
      margin-bottom: 12px;
      font-size: 16px;
      font-weight: bold;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 90vw;
      max-width: 360px;
      height: 90vw;
      max-height: 360px;
    }
    .card {
      background: #161b22;
      border: 2px solid #30363d;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }
    .card.flipped {
      background: #21262d;
      border-color: #58a6ff;
      transform: rotateY(180deg);
    }
    .card.matched {
      background: #238636;
      border-color: #3fb950;
      cursor: default;
    }
    .btn {
      margin-top: 15px;
      background: #238636;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>MOVES: <span id="moves">0</span></div>
    <div>TIME: <span id="timer">0s</span></div>
  </div>
  <div class="grid" id="grid"></div>
  <button class="btn" onclick="initGame()">🔄 Restart Game</button>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    const icons = ['🚀', '👾', '💎', '🔥', '⚡', '🎮', '🌟', '🏆'];
    let cards = [];
    let flippedCards = [];
    let matchedPairs = 0;
    let moves = 0;
    let timer = 0;
    let timerInterval = null;

    function initGame() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      cards = [...icons, ...icons].sort(() => 0.5 - Math.random());
      flippedCards = [];
      matchedPairs = 0;
      moves = 0;
      timer = 0;
      document.getElementById('moves').innerText = '0';
      document.getElementById('timer').innerText = '0s';
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timer++;
        document.getElementById('timer').innerText = timer + 's';
      }, 1000);

      cards.forEach((icon, i) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.icon = icon;
        card.dataset.index = i;
        card.innerText = '❓';
        card.onclick = () => onCardClick(card);
        grid.appendChild(card);
      });
    }

    function onCardClick(card) {
      if (card.classList.contains('flipped') || card.classList.contains('matched') || flippedCards.length >= 2) return;

      card.classList.add('flipped');
      card.innerText = card.dataset.icon;
      flippedCards.push(card);
      if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();

      if (flippedCards.length === 2) {
        moves++;
        document.getElementById('moves').innerText = moves;
        checkMatch();
      }
    }

    function checkMatch() {
      const [c1, c2] = flippedCards;
      if (c1.dataset.icon === c2.dataset.icon) {
        c1.classList.add('matched');
        c2.classList.add('matched');
        matchedPairs++;
        flippedCards = [];
        if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

        if (matchedPairs === icons.length) {
          clearInterval(timerInterval);
          const score = Math.max(10, 1000 - (moves * 25 + timer * 10));
          window.parent.postMessage({
            type: 'SCORE_UPDATE',
            gameId: 'game-memory',
            score: score
          }, '*');
          if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
          setTimeout(() => alert(`🎉 Completed in ${moves} moves and ${timer}s! Score: ${score}`), 300);
        }
      } else {
        setTimeout(() => {
          c1.classList.remove('flipped');
          c2.classList.remove('flipped');
          c1.innerText = '❓';
          c2.innerText = '❓';
          flippedCards = [];
        }, 700);
      }
    }

    initGame();
  </script>
</body>
</html>
