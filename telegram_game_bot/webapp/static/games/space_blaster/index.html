<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Space Blaster 3000</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #05050d;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 90vw;
      max-width: 360px;
      margin-bottom: 8px;
      font-weight: bold;
      color: #38bdf8;
    }
    #canvas {
      background: #090919;
      border: 2px solid #3b82f6;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
      width: 90vw;
      max-width: 360px;
      height: 75vh;
      max-height: 560px;
      display: block;
    }
    .hint {
      margin-top: 8px;
      color: #94a3b8;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>SCORE: <span id="score">0</span></div>
    <div>LIVES: <span id="lives">❤️❤️❤️</span></div>
  </div>
  <canvas id="canvas"></canvas>
  <div class="hint">Drag your ship to move & auto-fire!</div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 360;
    canvas.height = 560;

    let player = { x: canvas.width / 2, y: canvas.height - 60, width: 34, height: 34, speed: 7 };
    let bullets = [];
    let enemies = [];
    let particles = [];
    let stars = [];
    let score = 0;
    let lives = 3;
    let frame = 0;
    let isGameOver = false;

    // Background stars
    for (let i = 0; i < 50; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2 + 1,
        speed: Math.random() * 2 + 0.5
      });
    }

    // Touch controls
    canvas.addEventListener('touchmove', e => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const touchX = (e.touches[0].clientX - rect.left) * scaleX;
      player.x = Math.max(player.width / 2, Math.min(canvas.width - player.width / 2, touchX));
    }, { passive: true });

    window.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const mouseX = (e.clientX - rect.left) * scaleX;
      if (mouseX >= 0 && mouseX <= canvas.width) {
        player.x = Math.max(player.width / 2, Math.min(canvas.width - player.width / 2, mouseX));
      }
    });

    function spawnExplosion(x, y, color) {
      for (let i = 0; i < 12; i++) {
        particles.push({
          x: x, y: y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          radius: Math.random() * 3 + 1,
          color: color,
          life: 20
        });
      }
    }

    function update() {
      if (isGameOver) return;
      frame++;

      // Auto-shoot bullets
      if (frame % 14 === 0) {
        bullets.push({ x: player.x, y: player.y - 15, vy: -9 });
      }

      // Move bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].y += bullets[i].vy;
        if (bullets[i].y < 0) bullets.splice(i, 1);
      }

      // Spawn enemies
      if (frame % 45 === 0) {
        enemies.push({
          x: Math.random() * (canvas.width - 40) + 20,
          y: -20,
          vy: Math.random() * 2 + 2,
          radius: 14,
          color: ['#f43f5e', '#ec4899', '#a855f7', '#fb923c'][Math.floor(Math.random() * 4)]
        });
      }

      // Move enemies
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.y += e.vy;

        // Player collision
        const distToPlayer = Math.hypot(e.x - player.x, e.y - player.y);
        if (distToPlayer < e.radius + 15) {
          spawnExplosion(e.x, e.y, '#f43f5e');
          enemies.splice(i, 1);
          lives--;
          updateLives();
          if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
          if (lives <= 0) return gameOver();
          continue;
        }

        // Bullet collisions
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (Math.hypot(e.x - b.x, e.y - b.y) < e.radius + 5) {
            spawnExplosion(e.x, e.y, e.color);
            enemies.splice(i, 1);
            bullets.splice(j, 1);
            score += 25;
            document.getElementById('score').innerText = score;
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            break;
          }
        }

        if (e.y > canvas.height + 20) {
          enemies.splice(i, 1);
        }
      }

      // Update particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function updateLives() {
      let hearts = '';
      for (let i = 0; i < lives; i++) hearts += '❤️';
      document.getElementById('lives').innerText = hearts || '💀';
    }

    function gameOver() {
      isGameOver = true;
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
      window.parent.postMessage({
        type: 'SCORE_UPDATE',
        gameId: 'game-space-blaster',
        score: score
      }, '*');
      alert(`🚀 Missions Over! Final Score: ${score}`);
      location.reload();
    }

    function draw() {
      ctx.fillStyle = '#05050f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Stars
      ctx.fillStyle = '#ffffff';
      stars.forEach(s => {
        s.y += s.speed;
        if (s.y > canvas.height) s.y = 0;
        ctx.fillRect(s.x, s.y, s.size, s.size);
      });

      // Bullets
      ctx.fillStyle = '#00f2fe';
      ctx.shadowColor = '#00f2fe';
      ctx.shadowBlur = 8;
      bullets.forEach(b => {
        ctx.fillRect(b.x - 2, b.y, 4, 10);
      });

      // Enemies
      enemies.forEach(e => {
        ctx.fillStyle = e.color;
        ctx.shadowColor = e.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
        ctx.fill();
      });

      // Player Ship
      ctx.fillStyle = '#38bdf8';
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.moveTo(player.x, player.y - 18);
      ctx.lineTo(player.x - 16, player.y + 16);
      ctx.lineTo(player.x + 16, player.y + 16);
      ctx.closePath();
      ctx.fill();

      // Thruster flame
      ctx.fillStyle = '#fb923c';
      ctx.beginPath();
      ctx.moveTo(player.x - 6, player.y + 16);
      ctx.lineTo(player.x + 6, player.y + 16);
      ctx.lineTo(player.x, player.y + 24 + Math.random() * 6);
      ctx.closePath();
      ctx.fill();

      // Particles
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 4;
        ctx.fillRect(p.x, p.y, p.radius, p.radius);
      });

      ctx.shadowBlur = 0;
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
